<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savings Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0a0a0a; color:white; font-family:sans-serif; }
.card { background:#111; border:1px solid #222; border-radius:16px; padding:16px; }
.input { background:#1a1a1a; border:1px solid #333; padding:10px; border-radius:10px; width:100%; color:white; }
.btn { border-radius:10px; padding:10px; font-size:14px; }
</style>
</head>

<body class="p-6 max-w-md mx-auto">

<h1 class="text-2xl font-light mb-6 text-gray-300">Savings Tracker</h1>

<!-- ADD -->
<div class="card mb-4">
  <input id="name" placeholder="ชื่อเป้าหมาย" class="input mb-2">
  <input id="target" type="number" placeholder="จำนวนเงิน (฿)" class="input mb-3">

  <button onclick="addGoal()" class="btn bg-white text-black w-full">
    สร้างเป้าหมาย
  </button>
</div>

<!-- LIST -->
<div id="list" class="space-y-3"></div>

<script>
let data = JSON.parse(localStorage.getItem("data") || "[]");

function save(){
  localStorage.setItem("data", JSON.stringify(data));
  render();
}

function addGoal(){
  let name = document.getElementById("name").value.trim();
  let target = parseInt(document.getElementById("target").value);

  if(!name || !target) return;

  data.push({
    id: Date.now(),
    name,
    target,
    saved: 0
  });

  document.getElementById("name").value = "";
  document.getElementById("target").value = "";

  save();
}

function deposit(id){
  let amount = prompt("ใส่จำนวนเงิน:");
  if(!amount) return;

  let g = data.find(x=>x.id==id);
  g.saved += parseInt(amount);

  save();
}

function withdraw(id){
  let amount = prompt("ถอนเท่าไหร่:");
  if(!amount) return;

  let g = data.find(x=>x.id==id);
  g.saved -= parseInt(amount);

  if(g.saved < 0) g.saved = 0;

  save();
}

function render(){
  let html = "";

  data.forEach(g=>{
    let percent = Math.min(100, (g.saved / g.target) * 100);

    html += `
    <div class="card">
      <div class="flex justify-between mb-2">
        <span>${g.name}</span>
        <span class="text-gray-500 text-sm">${Math.round(percent)}%</span>
      </div>

      <div class="w-full bg-gray-800 h-2 rounded mb-2">
        <div class="bg-green-500 h-2 rounded" style="width:${percent}%"></div>
      </div>

      <div class="flex justify-between text-sm text-gray-400 mb-3">
        <span>฿${g.saved.toLocaleString()}</span>
        <span>฿${g.target.toLocaleString()}</span>
      </div>

      <div class="flex gap-2">
        <button onclick="deposit(${g.id})" class="btn bg-green-600 w-full">ฝาก</button>
        <button onclick="withdraw(${g.id})" class="btn bg-red-600 w-full">ถอน</button>
      </div>
    </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render();
</script>

</body>
</html>
